# XcodeGen project definition. Generate the Xcode project with `xcodegen generate`.
# Edit build settings here, not in Xcode: Revontulet.xcodeproj is generated and not committed.
name: Revontulet

options:
  bundleIdPrefix: fi.juusimaa
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  knownRegions: [en, fi, sv]
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Strings are looked up by key, not generated symbols; a key like "%@, %@" has no symbol name.
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Shared by the app and the widget extension, which must carry the same versions.
    MARKETING_VERSION: "4.1"
    # Xcode Cloud replaces this with its build number (ci_scripts/ci_post_clone.sh).
    CURRENT_PROJECT_VERSION: "1"

packages:
  AuroraCore:
    path: Packages/AuroraCore

targets:
  Revontulet:
    type: application
    platform: iOS
    sources:
      - path: Revontulet
        excludes:
          - "Config/*.plist"
      # Compiled into the app and the widget extension.
      - path: Shared
    dependencies:
      - package: AuroraCore
      - target: RevontuletWidgets
    settings:
      configs:
        # The alert service (contracts/alert-api.md): Release builds use the production instance,
        # Debug builds a development instance (APNs sandbox) on localhost. "$()" keeps "//" from
        # being read as a comment.
        Debug:
          ALERTS_BASE_URL: "http:/$()/localhost:8080/v1"
          INFOPLIST_FILE: Revontulet/Config/Info-Debug.plist
        Release:
          ALERTS_BASE_URL: "https:/$()/alerts.revontuletapp.com/v1"
          INFOPLIST_FILE: Revontulet/Config/Info.plist
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.juusimaa.revontulet
        PRODUCT_NAME: Revontulet
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Push for aurora alerts, and the App Group shared with the widgets. Automatic signing
        # switches aps-environment to production for TestFlight and App Store exports.
        CODE_SIGN_ENTITLEMENTS: Revontulet/Revontulet.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Revontulet
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          Your location is used on this device to find the nearest measurement station and your
          municipality. Your position is never sent anywhere; aurora alerts, if you turn them on,
          share only a coarse area of Finland.
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Only HTTPS via URLSession, which is exempt; skips the export compliance prompt in App Store Connect.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  RevontuletWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RevontuletWidgets
        excludes:
          - "Info.plist"
      - path: Shared
      - path: Revontulet/Resources/Localizable.xcstrings
    dependencies:
      - package: AuroraCore
    info:
      path: RevontuletWidgets/Info.plist
      properties:
        # XcodeGen writes 1.0 and 1 otherwise; the extension must match the app.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.juusimaa.revontulet.widgets
        PRODUCT_NAME: RevontuletWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Revontulet
        # The App Group only (contracts/shared-storage.md).
        CODE_SIGN_ENTITLEMENTS: RevontuletWidgets/RevontuletWidgets.entitlements
        SKIP_INSTALL: YES

  RevontuletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RevontuletTests
    dependencies:
      - target: Revontulet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.juusimaa.revontulet.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Revontulet.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Revontulet"
        BUNDLE_LOADER: "$(TEST_HOST)"

  RevontuletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RevontuletUITests
    dependencies:
      - target: Revontulet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.juusimaa.revontulet.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Revontulet

schemes:
  Revontulet:
    build:
      targets:
        Revontulet: all
        RevontuletWidgets: all
        RevontuletTests: [test]
        RevontuletUITests: [test]
    run:
      # Simulator location on every run; switch via Debug → Simulate Location.
      simulateLocation:
        allow: true
        defaultLocation: Revontulet/Locations/Oulu.gpx
    test:
      targets:
        - RevontuletTests
        - RevontuletUITests
