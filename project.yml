# XcodeGen project definition. Generate the Xcode project with `xcodegen generate`.
# Edit build settings here, not in Xcode: Revontulet.xcodeproj is generated and not committed.
name: Revontulet

options:
  bundleIdPrefix: fi.juusimaa
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  knownRegions: [en, fi, sv]
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Strings are looked up by key, not generated symbols; a key like "%@, %@" has no symbol name.
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  AuroraCore:
    path: Packages/AuroraCore

targets:
  Revontulet:
    type: application
    platform: iOS
    sources:
      - path: Revontulet
    dependencies:
      - package: AuroraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.juusimaa.revontulet
        PRODUCT_NAME: Revontulet
        MARKETING_VERSION: "1.0"
        # Xcode Cloud replaces this with its build number (ci_scripts/ci_post_clone.sh).
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Revontulet
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          Your location is used only on this device to find the nearest measurement station
          and your municipality. It is never sent anywhere.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Only HTTPS via URLSession, which is exempt; skips the export compliance prompt in App Store Connect.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  RevontuletUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RevontuletUITests
    dependencies:
      - target: Revontulet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.juusimaa.revontulet.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Revontulet

schemes:
  Revontulet:
    build:
      targets:
        Revontulet: all
        RevontuletUITests: [test]
    run:
      # Simulator location on every run; switch via Debug → Simulate Location.
      simulateLocation:
        allow: true
        defaultLocation: Revontulet/Locations/Oulu.gpx
    test:
      targets:
        - RevontuletUITests
